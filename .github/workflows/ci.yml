name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: ./tests/deploy.test.ps1
        shell: pwsh
      - run: npx wrangler types worker-configuration.d.ts --env-interface CloudflareBindings --include-runtime false --strict-vars false --check
      - run: npx wrangler deploy --dry-run
