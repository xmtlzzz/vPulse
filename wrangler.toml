# ==============================================================================
# vPulse - Cloudflare Worker + D1 + Static Assets Configuration
# ==============================================================================

name = "vpulse"
main = "worker/index.ts"
compatibility_date = "2025-08-01"

# ── Frontend Static Assets (Vite build dist) ──────────────────────────────────
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ── Cloudflare D1 Database ────────────────────────────────────────────────────
# Run: npx wrangler d1 create vpulse-db to obtain your real database_id
[[d1_databases]]
binding = "DB"
database_name = "vpulse-db"
database_id = "70cb6136-5df2-4efc-8228-a3f04e4ee262"

# Check due monitors every 3 minutes; each monitor keeps its own interval.
[triggers]
crons = ["*/3 * * * *"]

# ── Environment Variables ─────────────────────────────────────────────────────
[vars]
# Store WEBHOOK_URL with `wrangler secret put WEBHOOK_URL`; unset disables delivery.
WEBHOOK_TYPE = "generic"

[observability]
enabled = true

